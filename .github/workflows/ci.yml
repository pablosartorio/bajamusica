name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - name: Instalar dependencias
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run --no-sync ruff check .
      - name: Tests (pytest)
        run: uv run --no-sync pytest -v

  # El build del .exe tarda varios minutos y pesa ~100 MB: solo en master
  # o cuando se pide a mano desde la pestaña Actions (workflow_dispatch).
  build-windows:
    needs: test
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - name: Instalar dependencias
        run: uv sync --locked --no-dev --group build
      - name: Descargar ffmpeg para el bundle
        run: uv run --no-sync python _get_ffmpeg.py
      - name: Compilar con PyInstaller
        run: uv run --no-sync pyinstaller --clean --noconfirm bajamusica.spec
      - name: Verificar que el bundle quedó completo
        shell: bash
        run: |
          test -f dist/bajamusica/bajamusica.exe
          test -f dist/bajamusica/_internal/ffmpeg.exe
          test -d dist/bajamusica/_internal/templates
          test -d dist/bajamusica/_internal/static
      - uses: actions/upload-artifact@v4
        with:
          name: bajamusica-windows
          path: dist/bajamusica/
          retention-days: 30
